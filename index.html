<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>For Yamuna</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg1: #ffd6e7; --bg2: #ffeef6; --card: #ffffffcc;
      --yes: #ff3b7a; --yesHover: #ff1f68;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif; overflow: hidden; padding: 16px;
      transition: background 0.5s ease;
    }
    #confettiCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
    .card {
      width: min(720px, 92vw); padding: 26px 22px; background: var(--card);
      backdrop-filter: blur(10px); border-radius: 22px; text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }
    .art { width: min(260px, 80vw); margin: 0 auto 10px; display: block; filter: drop-shadow(0 10px 14px rgba(0,0,0,.12)); }
    h1 { font-size: clamp(26px, 4vw, 44px); margin: 12px 0 18px; color: #333; }
    .button-zone { position: relative; width: min(520px, 92%); height: 150px; margin: 0 auto; touch-action: none; }
    button {
      position: absolute; top: 50%; transform: translateY(-50%);
      padding: 16px 24px; font-size: 18px; font-weight: 800; border-radius: 999px;
      border: none; cursor: pointer; box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none; -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }
    #yesBtn { left: 18%; background: var(--yes); color: #fff; z-index: 10; }
    #noBtn { left: 62%; background: #e5e7eb; color: #111827; }
    .hint { margin-top: 10px; font-size: 13px; opacity: .7; }
    .result { display: none; margin-top: 18px; animation: pop .35s ease; }
    .result h2 { font-size: clamp(28px, 4.5vw, 40px); margin: 10px 0; color: #ff3b7a; }
    .fireworks { width: min(380px, 90vw); margin: 0 auto; display: block; border-radius: 12px; }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <main class="card">
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1"><stop offset="0" stop-color="#f7c7a1"/><stop offset="1" stop-color="#f2a97b"/></linearGradient>
        <linearGradient id="heart" x1="0" x2="1"><stop offset="0" stop-color="#ff4d7d"/><stop offset="1" stop-color="#ff1f68"/></linearGradient>
      </defs>
      <path d="M250 50 C250 33 270 25 282 38 C294 25 314 33 314 50 C314 78 282 92 282 106 C282 92 250 78 250 50Z" fill="url(#heart)"/>
      <path d="M90 120 C90 70 140 40 190 60 C240 40 290 70 290 120 C290 180 240 210 190 210 C140 210 90 180 90 120Z" fill="url(#fur)"/>
      <circle cx="160" cy="130" r="8"/><circle cx="220" cy="130" r="8"/>
    </svg>

    <div id="setup-content">
      <h1>yamuna will you be my valentine?</h1>
      <section class="button-zone" id="zone">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </section>
      <div class="hint" id="hint">“No” is not an option! 😉</div>
    </div>

    <section class="result" id="result">
      <h2>YAY! You've made me the happiest! ❤️</h2>
      <p style="font-size: 18px; color: #ff3b7a; font-weight: bold;">Can't wait for our Valentine's date, Yamuna!</p>
      <img class="fireworks" src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" alt="Fireworks" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const setupContent = document.getElementById("setup-content");
    const hint = document.getElementById("hint");
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      confettiCanvas.width = window.innerWidth * dpr;
      confettiCanvas.height = window.innerHeight * dpr;
    }
    window.addEventListener("resize", resize); resize();

    const confettiInstance = confetti.create(confettiCanvas, { resize: false, useWorker: true });

    let yesScale = 1;
    function moveNo() {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      noBtn.style.left = Math.random() * (z.width - b.width) + "px";
      noBtn.style.top = Math.random() * (z.height - b.height) + "px";
      yesScale = Math.min(2.5, yesScale + 0.2);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width/2) - e.clientX, (b.top + b.height/2) - e.clientY);
      if (d < 100) moveNo();
    });

    yesBtn.addEventListener("click", () => {
      document.body.style.background = "radial-gradient(circle, #ffb3d1, #ffecf2)";
      setupContent.style.display = "none";
      result.style.display = "block";
      
      const duration = 5 * 1000;
      const end = Date.now() + duration;
      (function frame() {
        confettiInstance({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff3b7a', '#ffadad'] });
        confettiInstance({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff3b7a', '#ffadad'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    });
  </script>
</body>
</html>
